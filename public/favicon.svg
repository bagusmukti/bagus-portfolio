<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- background rounded square -->
  <rect width="64" height="64" rx="14" fill="#4a4580"/>
  <!-- subtle gradient overlay -->
  <rect width="64" height="64" rx="14" fill="url(#grad)" opacity="0.4"/>
  <!-- initials BM -->
  <text
    x="32" y="45"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="38"
    font-weight="700"
    text-anchor="middle"
    fill="#ffffff"
    letter-spacing="-0.5"
  >BM</text>
  <!-- peach accent dot -->
  <circle cx="50" cy="14" r="5" fill="#e8826a"/>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6e69b0"/>
      <stop offset="100%" stop-color="#4a4580"/>
    </linearGradient>
  </defs>
</svg>
